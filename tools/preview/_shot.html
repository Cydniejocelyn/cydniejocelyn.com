<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#071A1F}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.style.width  = (q.get('w')||1440)+'px';
f.style.height = (q.get('h')||1000)+'px';
f.src = q.get('p') || '/retreats/';
var y = +(q.get('y')||0), id = q.get('id');
f.addEventListener('load', function(){
  var w = f.contentWindow, step = 0;
  if (id) { var el = f.contentDocument.getElementById(id); if (el) y = el.getBoundingClientRect().top + w.scrollY - 40; }
  (function walk(){
    var to = Math.min(y, step * 600);
    w.scrollTo({top: to, behavior:'instant'}); w.dispatchEvent(new w.Event('scroll'));
    step++;
    if (to < y) setTimeout(walk, 90); else setTimeout(function(){ w.scrollTo({top:y, behavior:'instant'}); w.dispatchEvent(new w.Event('scroll')); }, 300);
  })();
});
</script>
