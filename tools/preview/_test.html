<!doctype html><meta charset="utf-8">
<style>
 html,body{margin:0;background:#fff;font:16px/1.5 ui-monospace,Menlo,monospace;color:#111}
 #log{padding:14px;white-space:pre-wrap}
 .p{color:#0a7a3d}.f{color:#b00020;font-weight:700}
 iframe{position:fixed;right:0;bottom:0;width:1100px;height:900px;border:1px solid #ccc;opacity:.001;pointer-events:none}
</style>
<div id="log">running…</div>
<iframe id="f"></iframe>
<script>
var lines=[], f=document.getElementById('f');
function ok(n,c){lines.push((c?'PASS  ':'FAIL  ')+n);}
function done(){document.getElementById('log').innerHTML =
  lines.map(function(l){return '<span class="'+(l[0]=='P'?'p':'f')+'">'+l+'</span>';}).join('\n')
  + '\n\n' + lines.filter(function(l){return l[0]=='F'}).length + ' failing of ' + lines.length;}
/* Clear any remembered cookie choice BEFORE the page under test loads.
   runsuite.sh reuses `--user-data-dir` between runs, so localStorage
   survives, and one earlier run that clicked Accept left the choice stored
   for every run after it: the banner never appeared again and two
   assertions failed against code that was correct. The harness and the
   iframe are the same origin, so clearing it here clears it there. */
try { localStorage.removeItem('cj-cookie-choice'); } catch (e) {}
f.src = new URLSearchParams(location.search).get('p') || '/retreats/greece/';
/* A SECOND FRAME AT 375, created here rather than later on purpose.
   The suite waits six seconds for the page under test to settle; this gets
   the same six seconds. Built inside `load` and READ synchronously in the
   assertions below -- an earlier version created it at assertion time and
   checked it on a timeout, which fired after done() had already rendered the
   log, so its two assertions silently never counted. If a guard is not in
   the tally it is not a guard. */
var probe375 = null;
f.addEventListener('load', function(){
 var w=f.contentWindow, d=f.contentDocument;
 probe375 = document.createElement('iframe');
 probe375.style.cssText = 'position:fixed;left:-9999px;top:0;width:375px;height:812px;border:0';
 probe375.src = f.src;
 document.body.appendChild(probe375);
 // let boot() run and the scroll watcher settle
 var y=0, everPy=null;
 var iv=setInterval(function(){
   var ps0=d.querySelectorAll('.par');
   if(!everPy) everPy=[].map.call(ps0,function(){return null;});
   [].forEach.call(ps0,function(e,i){
     var v=e.style.getPropertyValue('--py');
     if(v!=='' && everPy[i]===null) everPy[i]=v;
   });
   y+=220; w.scrollTo({top:y,behavior:'instant'}); w.dispatchEvent(new w.Event('scroll'));
   if(y>d.body.scrollHeight+900){clearInterval(iv);}
 },26);
 setTimeout(function(){
  try{
   // ---- gallery ----
   var shots=d.querySelectorAll('.rt-shot, .gal-item');
   var hasGal = !!d.querySelector('[data-gallery]');
   if(hasGal) ok('gallery: tiles found ('+shots.length+')', shots.length>0);
   if(hasGal) ok('gallery: every tile got a button', shots.length>0 && [].every.call(shots,function(s){return s.querySelector('button');}));
   if(hasGal) ok('gallery: every tile marked is-live', shots.length>0 && [].every.call(shots,function(s){return s.classList.contains('is-live');}));
   if(hasGal) ok('gallery: every tile declares data-cursor', shots.length>0 && [].every.call(shots,function(s){return s.getAttribute('data-cursor');}));
   var box=d.querySelector('.lbx');
   if(hasGal) ok('lightbox: built and hidden at rest', !!box && box.hidden);
   if(box && shots.length){
     shots[1].querySelector('button').click();
     ok('lightbox: opens on tile click', !box.hidden);
     var img=box.querySelector('.lbx-stage img');
     ok('lightbox: shows the full-size source', /bath-9|bath-1200/.test(img.getAttribute('src')||''));
     ok('lightbox: carries the caption', (box.querySelector('.lbx-cap').textContent||'').length>3);
     ok('lightbox: focus moved into the dialog', d.activeElement && d.activeElement.classList.contains('lbx-x'));
     ok('lightbox: page behind is locked', d.documentElement.style.overflow==='hidden');
     var src0 = img.getAttribute('src');
     box.querySelector('[data-go="1"]').click();
     ok('lightbox: next advances', box.querySelector('.lbx-stage img').getAttribute('src')!==src0);
     box.querySelector('[data-go="-1"]').click();
     ok('lightbox: previous goes back', /bath-/.test(box.querySelector('.lbx-stage img').getAttribute('src')||''));
     var ev=new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true});
     d.dispatchEvent(ev);
     ok('lightbox: Escape closes it', box.hidden);
     ok('lightbox: scroll lock released', d.documentElement.style.overflow==='');
     ok('lightbox: focus returned to the tile', d.activeElement && d.activeElement.closest && !!d.activeElement.closest('.rt-shot, .gal-item'));
   }
   // ---- cursor ----
   var crs=d.querySelector('.crs');
   /* initCursor() returns early on a page with no [data-cursor] targets, which
      is every page that is not a gallery. Asserting the companion exists there
      reports a site bug that is the site working. Found running /a-sounding/. */
   if (!d.querySelector('[data-cursor]')) {
     ok('cursor: correctly NOT built, this page declares no targets', !crs);
   } else if (w.matchMedia('(prefers-reduced-motion: reduce)').matches) {
     ok('cursor: correctly NOT built under reduced motion', !crs);
   } else {
     ok('cursor: companion built', !!crs);
   }
   ok('cursor: hidden until a target is under it', !crs || !crs.classList.contains('is-on'));
   if(crs && shots.length){
     var r=shots[0].getBoundingClientRect();
     shots[0].dispatchEvent(new w.PointerEvent('pointermove',{clientX:r.left+20,clientY:r.top+20,pointerType:'mouse',bubbles:true}));
     ok('cursor: shows over a gallery tile', crs.classList.contains('is-on'));
     ok('cursor: names the action ("'+crs.firstChild.textContent+'")', /^(View|Open)$/.test(crs.firstChild.textContent));
     ok('cursor: positioned by transform', /translate3d/.test(crs.style.transform||''));
     d.body.dispatchEvent(new w.PointerEvent('pointermove',{clientX:2,clientY:2,pointerType:'mouse',bubbles:true}));
     ok('cursor: hides again off target', crs.classList.contains('is-off'));
   }
   // ---- video (retreats page only) ----
   var v=d.querySelector('[data-video]');
   if(v){
     ok('video: nothing from youtube before the click', d.querySelectorAll('iframe[src*="youtube"]').length===0);
     ok('video: is a real link with no JS', (v.getAttribute('href')||'').indexOf('youtube.com/watch')>-1);
     v.click();
     var yt=v.querySelector('iframe');
     ok('video: click swaps in the player', !!yt);
     ok('video: uses the no-cookie host', !!yt && /youtube-nocookie\.com/.test(yt.src));
     ok('video: starts where asked', !!yt && /start=3/.test(yt.src));
   }
   // ---- faq ----
   /* Guarded on the count. Not every page has questions: /the-letters/ has
      none, and indexing det[0] there threw and took the whole run down before
      any of that page's own assertions ran. Both `open` writes stay one per
      tick, which is trap 4 in the README. */
   var det=d.querySelectorAll('.faq details');
   if(det.length<2){
     ok('faq: this page has no questions block, correctly', det.length===0);
     setTimeout(rest,0);
   } else {
     ok('faq: closed at rest ('+det.length+' questions)', ![].some.call(det,function(x){return x.open;}));
     det[0].open=true;
     setTimeout(function(){
       det[1].open=true;
       setTimeout(function(){
         /* THIS ASSERTION USED TO BE THE OPPOSITE. The questions closed each
            other, and that is right when the panels are long enough that two
            open ones would strand a reader. These are two or three sentences
            and several are direct comparisons -- A Sounding against The
            Build, what is included against what is not -- so a reader
            answering "which of these do I want" had to hold one answer in
            their head while opening the other. Changed in session
            twenty-three, finding 9. If this goes red, check whether somebody
            put the sibling-closing handler back in initFaq. */
         ok('faq: opening one leaves the other open, so two can be compared',
            det[0].open && det[1].open);
         det[0].open=false; det[1].open=false;
         rest();
       },80);
     },80);
   }

   function rest(){
    try{
     // ---- reveals ----
     var t=d.querySelectorAll('.r-up,.r-fade,.r-img,.split');
     var unrev=[].filter.call(t,function(e){return !e.classList.contains('is-in');});
     ok('reveals: everything scrolled past is revealed ('+(t.length-unrev.length)+'/'+t.length+')', unrev.length===0);
   // ---- parallax and the map ----
   var reduced = w.matchMedia('(prefers-reduced-motion: reduce)').matches;
   ok('probe: prefers-reduced-motion is '+(reduced?'REDUCE':'no-preference'), true);
   var pars = d.querySelectorAll('.par');
   if(pars.length && !reduced){
     // what each target read while it was on screen, not what it reads now
     var vals = (everPy || []).map(function(v){ return v === null ? '' : v; });
     var set  = vals.filter(function(v){ return v !== ''; });
     // An element sitting exactly on the viewport centre gets 0px and that is
     // correct, so the test is that every target is DRIVEN and none exceeds
     // the 12px cap -- not that every one has moved at this instant.
     var capped = set.filter(function(v){ return Math.abs(parseFloat(v)) <= 12.01; });
     ok('parallax: '+set.length+'/'+pars.length+' targets driven ['+vals.join(', ')+']', set.length===pars.length);
     ok('parallax: none past the 12px cap', capped.length===set.length);
   } else if (pars.length) {
     var none = [].every.call(pars, function(e){ return !e.style.getPropertyValue('--py'); });
     ok('parallax: correctly OFF under reduced motion ('+pars.length+' targets)', none);
   }
   var map = d.querySelector('.usmap');
   if(map){
     ok('map: inlined so it can be styled', map.tagName.toLowerCase()==='svg');
     ok('map: has an accessible name', !!d.getElementById('usmap-t'));
     ok('map: outline uses pathLength so the draw is length-independent',
        d.querySelector('.usmap-line').getAttribute('pathLength')==='1');
     ok('map: revealed, so the draw keyframe is armed',
        !!map.closest('.rt-date-fig') && !!d.querySelector('.rt-date.is-in'));
   }
   // ---- the rail ----
   var gal = d.querySelector('[data-rail]');
   if(gal){
     var rail = gal.querySelector('.gal-rail');
     var tiles = gal.querySelectorAll('.gal-item');
     ok('rail: '+tiles.length+' tiles, and it overflows', tiles.length>6 && rail.scrollWidth > rail.clientWidth+50);
     ok('rail: marked live only after the arrows exist',
        gal.classList.contains('is-live') && !!gal.querySelector('.gal-nav'));
     ok('rail: every tile opens', tiles.length===gal.querySelectorAll('.gal-item button').length);
     ok('rail: back arrow disabled at the start', gal.querySelector('[data-go="-1"]').disabled);
     var before = rail.scrollLeft;
     rail.scrollLeft = 400; rail.dispatchEvent(new w.Event('scroll'));
     ok('rail: scrolling enables the back arrow', !gal.querySelector('[data-go="-1"]').disabled);
     ok('rail: the progress rule tracks it', (gal.style.getPropertyValue('--gal-x')||'').length>0);
     rail.scrollLeft = before; rail.dispatchEvent(new w.Event('scroll'));
     ok('rail: tiles all have one height', (function(){
        var hs=[].map.call(tiles,function(t){return Math.round(t.querySelector('img').getBoundingClientRect().height);});
        return hs.every(function(h){return Math.abs(h-hs[0])<2;});
     })());
   }
   // ---- the story scroll ----
   var cond = d.querySelector('.cond');
   if(cond){
     /* Was hardcoded to five. Cydnie's brief of 29 August 2026 cut the
        "sold vibes" recognition, which now lives once, in the refusals. The
        count that matters is that every item has a tick to drive it: a
        stepper with more buttons than moments strands the last one. */
     ok('story: every moment has a tick',
        d.querySelectorAll('.cond-item').length >= 3 &&
        d.querySelectorAll('.cond-item').length === d.querySelectorAll('.cond-ticks button').length);
     ok('story: stepped where there is room', cond.classList.contains('is-stepped') || reduced);
     /* AND IT MUST STILL STEP ON A PHONE. This exists because the pin was
        once removed below 768 to close a spacing gap, which turned the whole
        component into a static list on every phone: a signature interaction
        deleted as a side effect of a spacing fix, and completely invisible
        to a suite that only ever runs at 1280. The gap was closed properly
        afterwards by sizing the stage to its content -- see the note beside
        `.cond.is-stepped .cond-stage` in the mobile block of site.css.

        Read from the 375 frame created at the top of this file. */
     try {
       var pd = probe375 && probe375.contentDocument;
       var pc = pd && pd.querySelector('.cond');
       ok('story: still steps at 375, not flattened to a list',
          !!pc && pc.classList.contains('is-stepped'));
       /* Two things, and they are the two that were actually reported.

          CENTRED. The pinned block is one short statement on a dark field
          and belongs in the optical middle of the screen. Four passes moved
          it around trying to reclaim the leftover viewport and every one was
          worse; "it needs to be centered" was the correction. The tolerance
          is generous on the top side on purpose: the fixed header owns the
          first ~90px, so the block sitting a little below true centre is
          right, and only a real imbalance should fail.

          AND THE NUMBERS STAY NEXT TO THE RECOGNITION. The gap between
          `.cond-head` and `.cond-slots` is the component's own --s-6. It was
          once opened to 26vh as a way of absorbing section spacing, which
          put a 208px hole through the middle of the composition. Nothing
          should ever use it as that dial again. */
       var pStage = pc && pc.querySelector('.cond-stage');
       var pIn = pc && pc.querySelector('.cond-in');
       var pw = probe375.contentWindow;
       /* The block is only pinned once the reader is inside the track, and
          the probe frame is sitting at scroll 0. Measuring there reported
          the block 2491px below the fold and "not centred", which was true
          and meaningless. Scroll into the track first. `scroll-behavior` is
          smooth on this site, so it is forced off in the probe or the
          assignment animates and the measurement reads a position the page
          is still travelling through. */
       pw.document.documentElement.style.scrollBehavior = 'auto';
       pw.document.documentElement.scrollTop =
         pc.getBoundingClientRect().top + pw.scrollY + 500;
       var ir = pIn ? pIn.getBoundingClientRect() : null;
       var above = ir ? Math.round(ir.top) : -1;
       var below = ir ? Math.round(pw.innerHeight - ir.bottom) : -1;
       ok('story: at 375 the pinned block is centred (' + above + ' above, ' + below + ' below)',
          above > 0 && below > 0 && Math.abs(above - below) < 120);
       var pHead = pc && pc.querySelector('.cond-head');
       var pSlots = pc && pc.querySelector('.cond-slots');
       var inner = (pHead && pSlots)
         ? Math.round(pSlots.getBoundingClientRect().top - pHead.getBoundingClientRect().bottom) : -1;
       ok('story: and the numbers sit next to the recognition, not a screen away (' + inner + 'px)',
          inner >= 0 && inner <= 72);
     } catch (e) {
       ok('story: the 375 probe threw: ' + e.message, false);
     }
     ok('story: exactly one is lit', d.querySelectorAll('.cond-item.is-on').length<=1);
     /* Also hardcoded to five, for the same reason and with the same fix.
        What matters is that each tick is a real button, not how many. */
     ok('story: the ticks are real controls',
        d.querySelectorAll('.cond-ticks button').length >= 3);
   }
   // ---- the objection picker ----
   var rev = d.querySelector('[data-reversal]');
   if(rev){
     ok('objections: built into a tablist', !!d.querySelector('.rev-picks[role=tablist]'));
     /* This used to assert four, because until The Build page's questions
        became a picker on 28 August 2026 the only two on the site carried
        four each. Four is not the rule; one tab per pair is, and the page
        with ten was the one that proved the difference. It also never
        checked the "one panel shown" half of its own name. */
     var rtabs = d.querySelectorAll('.rev-picks [role=tab]');
     var rpans = rev.querySelectorAll('.rev-panels [role=tabpanel]');
     ok('objections: one tab per answer ('+rtabs.length+')',
        rtabs.length >= 2 && rtabs.length === rpans.length);
     ok('objections: exactly one panel shown',
        Array.prototype.filter.call(rpans, function(x){ return !x.hidden; }).length === 1);
     var t2 = rtabs[2];
     t2.click();
     ok('objections: picking one selects it', t2.getAttribute('aria-selected')==='true');
     ok('objections: picking one leaves one panel shown',
        Array.prototype.filter.call(rpans, function(x){ return !x.hidden; }).length === 1);
   }
   // ---- the two portraits ----
   var ppl = d.querySelectorAll('.rt-person img');
   if(ppl.length===2){
     var a=ppl[0].getBoundingClientRect(), b=ppl[1].getBoundingClientRect();
     ok('hosts: both portraits identical ('+Math.round(a.width)+'x'+Math.round(a.height)+')',
        Math.abs(a.width-b.width)<1 && Math.abs(a.height-b.height)<1);
   }
   // ---- the journey ----
   ok('journey: five stops', d.querySelectorAll('.trip > li').length===5 || !d.querySelector('.trip'));
   // ---- A Sounding ----
   var sd = d.querySelector('.sd-head');
   if(sd){
     ok('sounding: one h1, and it is the offer', d.querySelectorAll('h1').length===1);
     ok('sounding: the price is above the fold', /\$300/.test((d.querySelector('.sd-terms')||{}).textContent||''));
     var cross = d.querySelectorAll('.bd-cross a, .bd-cross span');
     ok('sounding: triad is three, Resurface current and not a link',
        cross.length===3 && cross[0].tagName==='SPAN' && cross[0].getAttribute('aria-current')==='page');
     /* Was: this page's nav button must scroll to #book rather than leave
        the site, which was right while the button sold A Sounding. On
        29 August 2026 the nav button became Contact on every page, because
        booking is reachable from four places on this page already and
        asking a question without paying was reachable from none. */
     ok('sounding: the nav button is Contact, like every other page',
        (function(){ var b=d.querySelector('.hdr .btn');
          return !!b && b.getAttribute('href')==='/contact/'; })());
     ok('sounding: six questions, mirrored in the FAQPage schema',
        d.querySelectorAll('.faq details').length===6 &&
        (d.querySelector('script[type="application/ld+json"]').textContent.match(/"@type": "Question"/g)||[]).length===6);
     ok('sounding: the A Sounding popup is NOT on this page',
        !d.querySelector('script[src*="sounding-popup"]') && !w.sdPopPreview);
     var q=d.querySelector('.sd-quote');
     ok('sounding: the quote is not indented by the figure default',
        !!q && w.getComputedStyle(q).marginLeft==='0px');
     var pn=d.querySelector('.sd-panel');
     ok('sounding: the panel is a step off its ground, not the same colour',
        !!pn && w.getComputedStyle(pn).backgroundColor !== w.getComputedStyle(pn.closest('section')).backgroundColor);
   }
   // ---- The Letters ----
   var lt = d.querySelector('.lt-head');
   if(lt){
     ok('letters: one h1', d.querySelectorAll('h1').length===1);
     var wls=d.querySelectorAll('.lt-waterline');
     ok('letters: two waterlines, both full bleed', wls.length===2 &&
        [].every.call(wls,function(r){var b=r.getBoundingClientRect();
          return Math.round(b.left)===0 && Math.abs(b.width-d.documentElement.clientWidth)<2;}));
     var sp=d.querySelector('.lt-specimen');
     ok('letters: the specimen is light paper on the dark stretch',
        !!sp && w.getComputedStyle(sp).backgroundColor!==w.getComputedStyle(sp.closest('section')).backgroundColor);
     ok('letters: two items in the pair, deliberately not three',
        d.querySelectorAll('.lt-pair > div').length===2);
     var LETTERS='cf_id/6a19d46a5cb4c5d7f86446a9';
     var ctas=[].slice.call(d.querySelectorAll('.lt-head .btn, #signup .btn'));
     ok('letters: both Get the letters CTAs are links to the real form ('+ctas.length+')',
        ctas.length===2 && ctas.every(function(a){
          return a.tagName==='A' && (a.getAttribute('href')||'').indexOf(LETTERS)>-1; }));
     ok('letters: no dead control left where the Flodesk button was',
        !d.getElementById('letters-open') && !d.getElementById('letters-fallback'));
     ok('letters: the A Sounding popup IS on this page',
        !!d.querySelector('script[src*="sounding-popup"]'));
     ok('letters: nav marks this page current',
        !!d.querySelector('.nav-links a[href="/the-letters/"][aria-current="page"]'));
   }
   // ---- the second picture pass and the ring, on /retreats/ ----
   if(d.querySelector('#format')){
     var ring=d.querySelector('.rt-ring');
     ok('retreats: the fifteen ring is on the format section', !!ring);
     ok('retreats: fifteen circles, one of them the open seat',
        !!ring && ring.querySelectorAll('circle').length===15 &&
        ring.querySelectorAll('circle.is-her').length===1);
     ok('retreats: the ring dots are not painted Breath on a light ground',
        !ring || w.getComputedStyle(ring.querySelector('.dot')).fill !== 'rgb(159, 204, 198)');
     var srcs=[].slice.call(d.images).map(function(i){return i.getAttribute('src')||'';}).join(' ');
     ok('retreats: the two clashing frames are gone',
        srcs.indexOf('cr-cards')===-1 && srcs.indexOf('cr-water')===-1);
     ok('retreats: their replacements are in place',
        srcs.indexOf('cr-floor')>-1 && srcs.indexOf('cr-surf')>-1);
     ok('retreats: before-you-book runs in three movements, terms first',
        d.querySelectorAll('#faq .rt-qs').length===3 &&
        d.querySelectorAll('#faq .rt-qs-lead').length===3 &&
        !!d.querySelector('#faq .rt-qs:first-child .rt-terms'));
     /* This used to assert seven accordions, a number that only meant
        "however many there were the day it was written", and adding an
        eighth question turned it red for no reason. The page's own comment
        says the FAQPage schema is generated from this markup, so that is
        the thing worth asserting: add a question and forget the schema and
        this goes red, which is the mistake that actually costs something. */
     var faqLd = null;
     [].slice.call(d.querySelectorAll('script[type="application/ld+json"]')).forEach(function (t) {
       var j; try { j = JSON.parse(t.textContent); } catch (e) { return; }
       ((j['@graph']) || [j]).forEach(function (n) {
         if (n && n['@type'] === 'FAQPage') faqLd = n.mainEntity || [];
       });
     });
     ok('retreats: every question on the page is in the FAQPage schema',
        !!faqLd && faqLd.length === d.querySelectorAll('.faq details').length);
     ok('retreats: terms are no longer a section of their own',
        !d.querySelector('#terms-h'));
     /* The heading holds while the movements scroll past it, the way the
        three long About sections do. Only above 56rem; below that the
        columns are stacked and there is nothing to hold against. */
     var holdCol = d.querySelector('#faq .grid-12--hold > .col-d');
     ok('retreats: the before-you-book heading is held, not scrolled away',
        !!holdCol && (w.innerWidth < 896 ||
                      w.getComputedStyle(holdCol).position === 'sticky'));
     ok('retreats: the private block uses a different frame from its neighbours',
        !!d.querySelector('#private .rt-aside') &&
        !d.querySelector('#private .grid-12'));
     ok('retreats: the ring and its caption sit on one line',
        (function(){var r=d.querySelector('.rt-ring');if(!r)return false;
          var svg=r.querySelector('svg').getBoundingClientRect();
          var cap=r.querySelector('.fig-cap').getBoundingClientRect();
          return w.innerWidth<672 || cap.left > svg.right - 2;})());
   }
   /* ---- the seam under the ask block ----
      It was Silt meeting Surface with the photograph's own top padding in
      between, so a strip of a second near-white sat above the picture and
      read as a white line across the page. A full bleed photograph is only
      its own transition when it starts at the section's edge. */
   var askSec = d.querySelector('#ask');
   if (askSec) {
     var grounds = askSec.nextElementSibling;
     while (grounds && grounds.nodeName !== 'SECTION') grounds = grounds.nextElementSibling;
     ok('greece: no colour change between the ask block and the photograph',
        !!grounds &&
        w.getComputedStyle(askSec).backgroundColor === w.getComputedStyle(grounds).backgroundColor);
     var closeSec = grounds && grounds.nextElementSibling;
     while (closeSec && closeSec.nodeName !== 'SECTION') closeSec = closeSec.nextElementSibling;
     ok('greece: and the close seams from the ground actually above it',
        !!closeSec && (closeSec.getAttribute('style') || '').indexOf('#DCE4E1') > -1);
   }

   // ---- the ask block on /retreats/greece/ ----
   if(d.querySelector('#booking')){
     var ask=d.querySelector('#ask');
     ok('greece: the ask block is on the page', !!ask);
     ok('greece: it points at the contact form',
        !!ask && !!ask.querySelector('a[href*="cf_id/69fa372ccd31fefc073c5d28"]'));
     ok('greece: it does not open a second door to the retreat',
        !!ask && ask.querySelectorAll('.btn').length===1);
   }
   /* ---- the form ids, pinned ----
      Six HoneyBook ids are in play across this site and several differ only
      in the first few characters. Rewriting the private block on 26 August
      swapped 69fa33ac for 69fa372c, which pointed a private retreat inquiry
      at the general contact mailbox, and nothing caught it: the link still
      worked, still returned 200, and still looked right. These assertions
      are the thing that catches it next time. Change a destination on
      purpose, change it here in the same commit. */
   var FORMS = {
     '69fa33ac59c6a6842e88b725': 'private retreat inquiry',
     '69fa372ccd31fefc073c5d28': 'contact',
     '6a19d46a5cb4c5d7f86446a9': 'The Letters',
     '6a21d07b6dcfbe3d85c663b6': 'Greece waitlist, paying in full',
     '6a21d63a1b6caddcac951777': 'Greece waitlist, six month plan',
     '69fa3c69e63a7a4c9bb354f1': 'April 2027 pre-registration'
   };
   if (d.querySelector('#private')) {
     var pv = d.querySelector('#private a[href*="honeybook"]');
     ok('retreats: the private block points at the private inquiry, not contact',
        !!pv && pv.getAttribute('href').indexOf('69fa33ac59c6a6842e88b725') > -1);
     ok('retreats: and it is a button, the way it was',
        !!pv && pv.classList.contains('btn'));
   }
   if (d.querySelector('#booking')) {
     /* The plan buttons are the ones that carry the step suffix. The plain
        waitlist links point at the bare form and are counted separately. */
     var plans = [].slice.call(d.querySelectorAll('a[href*="/1-Contact_Information"]'));
     ok('greece: both payment plans are wired to their own forms',
        plans.length === 2 &&
        plans.some(function (a) { return a.href.indexOf('6a21d07b6dcfbe3d85c663b6') > -1; }) &&
        plans.some(function (a) { return a.href.indexOf('6a21d63a1b6caddcac951777') > -1; }));
     /* They were three #booking anchors and none of them reached the form.
        Cydnie supplied the URL on 26 August; they are links out now, the
        same destination the home page and /retreats/ have always used for a
        plain "Join the waitlist". The booking band keeps both payment plans
        for the reader who wants to choose one. */
     var plain = [].slice.call(d.querySelectorAll('a[href$="6a21d07b6dcfbe3d85c663b6"]'));
     ok('greece: three plain waitlist links, hero, ask and close, all reaching the form',
        plain.length === 3);
     ok('greece: no waitlist control is a dead scroll anchor',
        [].slice.call(d.querySelectorAll('a')).filter(function (a) {
          return /waitlist/i.test(a.textContent) && a.getAttribute('href') === '#booking';
        }).length === 0);
   }
   var unknown = [].slice.call(d.querySelectorAll('a[href*="honeybook.com/widget"]'))
     .map(function (a) { var m = /cf_id\/([a-f0-9]+)/.exec(a.getAttribute('href')); return m && m[1]; })
     .filter(function (id) { return id && !FORMS[id]; });
   ok('forms: every HoneyBook id on this page is one of the known five',
      unknown.length === 0);

   /* ---- the footer, which must be the same on every page ----
      It used to differ on all seven: five different targets behind a link
      called "Questions", "Client work" pointing at a same-page anchor on the
      home page and a cross-page one everywhere else, a third slot that was
      Questions or Greece 2027 or Costa Rica 2026 depending where you stood,
      and the socials on the home page only. This is the list, in order. Move
      it here and on all seven pages in the same commit or this fails. */
   var FOOTER = [
     '/a-sounding/', '/retreats/', '/the-build/', '/the-build/#work',
     '/about/', '/the-letters/',
     '/contact/',
     'https://www.instagram.com/cydniejocelyn/',
     'https://www.facebook.com/profile.php?id=61575458834389',
     'https://www.pinterest.com/Cydniejocelyn/',
     'https://www.youtube.com/@Cydniejocelyn'
   ];
   var got = [].slice.call(d.querySelectorAll('.ftr .ftr-nav a')).map(function (a) {
     return a.getAttribute('href');
   });
   ok('footer: the same eleven links, in the same order, as every other page',
      got.length === FOOTER.length && got.every(function (h, i) { return h === FOOTER[i]; }));
   ok('footer: the three column headings are the same',
      [].slice.call(d.querySelectorAll('.ftr-nav h3')).map(function (h) {
        return h.textContent.trim();
      }).join('|') === 'The work|More|Elsewhere');
   ok('footer: nothing links the podcast',
      !d.querySelector('.ftr a[href*="she-rises-through-it"], .ftr a[href*="open.spotify.com"]'));

   /* Privacy and terms are one document at /privacy-policy/, built on 28
      August. The link used to be the ABSOLUTE https://cydniejocelyn.com/
      privacy-policy, which resolved to the OLD site and would have 404'd
      the moment the domain cut over to this build. It is relative now and
      it must stay relative on all nine pages. See HANDOFF section 7.3. */
   ok('footer: privacy and terms both point at the built page, relatively',
      !!d.querySelector('.ftr-btm a[href="/privacy-policy/"]') &&
      !!d.querySelector('.ftr-btm a[href="/privacy-policy/#terms"]'));
   ok('footer: nothing carries the absolute privacy URL that 404s at cutover',
      !d.querySelector('.ftr a[href^="https://cydniejocelyn.com/privacy-policy"]'));

   /* THE SERVICE AREA, human half and machine half, and they must agree.
      The line in the footer is one sentence on nine pages; the precise list
      is `areaServed` on the LocalBusiness node. If somebody edits one and
      not the other the site starts making two different claims about where
      Cydnie works. Fifteen cities, checked in both places. */
   var area = d.querySelector('.ftr-area');
   ok('footer: the service area line is present', !!area);
   var CITIES = ['Forest Lake','Blaine','Anoka','Ramsey','East Bethel','Lino Lakes',
                 'Hugo','Shoreview','White Bear Lake','Cambridge','Isanti',
                 'North Branch','Crosslake','Minneapolis'];
   ok('footer: every city in the service area line',
      !!area && CITIES.every(function (c) { return area.textContent.indexOf(c) > -1; }));
   var org = null;
   [].forEach.call(d.querySelectorAll('script[type="application/ld+json"]'), function (sc) {
     try {
       var g = JSON.parse(sc.textContent)['@graph'] || [];
       g.forEach(function (n) { if (String(n['@id']||'').indexOf('#organization') > -1) org = n; });
     } catch (e) {}
   });
   /* Only on a page that can rank. `/thequestions/` is `noindex` because its
      URL is event scoped, so it carries no organisation node ON PURPOSE and
      asserting one there reports a deliberate decision as a bug. */
   var rob = d.querySelector('meta[name="robots"]');
   var indexable = !rob || rob.content.indexOf('noindex') === -1;
   if (indexable) {
     ok('schema: a LocalBusiness node with the same fifteen cities in areaServed',
        !!org && (org['@type']||[]).indexOf('LocalBusiness') > -1 &&
        CITIES.concat(['Saint Paul']).every(function (c) {
          return (org.areaServed||[]).some(function (a) { return a.name === c; });
        }));
   } else {
     ok('schema: correctly NO organisation node, this page is noindex', !org);
   }

   /* The bare header, /thequestions/ only. The A Sounding label rendered
      Fathom on a Deepwater fill the first time it was built, because
      `.hdr.is-surfaced .btn` is (0,3,0) and `.btn--ink` is (0,1,0). Same
      specificity trap as the mobile nav links in session seven. */
   var bare = d.querySelector('.hdr--bare');
   if (bare) {
     ok('bare header: no toggle, so the one button is in the bar at every width',
        !bare.querySelector('.nav-toggle') && !d.documentElement.classList.contains('has-menu'));
     var ink = bare.querySelector('.btn--ink');
     ok('bare header: the button label is not the colour of its own fill',
        !!ink && w.getComputedStyle(ink).color !== w.getComputedStyle(ink).backgroundColor);
   }
   var soc = d.querySelector('.social a');
   ok('footer: the social marks are not in boxes',
      !!soc && w.getComputedStyle(soc).borderTopWidth === '0px' &&
      w.getComputedStyle(soc).backgroundColor === 'rgba(0, 0, 0, 0)');
   ok('footer: and they are still a 44px tap target',
      !!soc && soc.getBoundingClientRect().height >= 44 && soc.getBoundingClientRect().width >= 44);
   /* ---- emphasis inside a heading must be legible ----
      THIS IS THE THIRD TIME --accent HAS FAILED AS TEXT ON A DARK GROUND.
      It resolves to Meniscus #2F5A61 on Fathom and Deepwater, and Meniscus
      is a rules colour. `.carved em` used it, and "everyone who needed you."
      in the home page turn heading measured 2.02:1 -- reported by Cydnie as
      "it blends in with the page overall", which is what 2.02:1 looks like
      to a person. It is --label now, which is ground aware: Breath on the
      dark grounds, Deepwater on the light ones.

      The assertion is the contrast, not the token, because naming the right
      token is not the same as the result being readable. */
   (function () {
     var ems = [].slice.call(d.querySelectorAll('.head em, .carved em'));
     if (!ems.length) return;
     function rgb(v){var m=v.match(/\d+(\.\d+)?/g); return m?m.slice(0,3).map(Number):null;}
     function lum(c){var a=c.map(function(v){v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
       return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
     function ratio(x,y){var l1=lum(x),l2=lum(y); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
     function bgOf(el){var e=el; while(e){var b=w.getComputedStyle(e).backgroundColor;
       if(b && !/rgba\(0, 0, 0, 0\)|transparent/.test(b)) return rgb(b); e=e.parentElement;} return [255,255,255];}
     var worst = Math.min.apply(null, ems.map(function (e) {
       return ratio(rgb(w.getComputedStyle(e).color), bgOf(e));
     }));
     ok('type: emphasis in a heading is legible on its ground (' +
        ems.length + ' of them, worst ' + worst.toFixed(2) + ':1)', worst >= 4.5);
   })();

   /* ---- the nine frictions, session twenty-three ----
      Each of these was measured before it was changed, and each would go
      back to being wrong silently: a focus ring nobody sees, a link nobody
      can tell is a link, a nav that never says where you are. */
   var lnk = d.querySelector('a.link');
   if (lnk) {
     ok('links: an inline link draws its rule at REST, not only on hover',
        w.getComputedStyle(lnk, '::after').transform.indexOf('matrix(1,') === 0);
   }
   var lightBand = d.querySelector('.z-light, .z-silt');
   if (lightBand) {
     /* --focus must not be the same value on both grounds, which is the whole
        point of it existing rather than reusing --breath or --accent. */
     ok('focus: the ring has a ground-aware token, different on light',
        w.getComputedStyle(d.documentElement).getPropertyValue('--focus').trim() !==
        w.getComputedStyle(lightBand).getPropertyValue('--focus').trim());
   }
   var curNav = d.querySelector('.nav-links a[aria-current="page"]');
   if (curNav) {
     var otherNav = [].filter.call(d.querySelectorAll('.nav-links a'),
                                   function (a) { return a !== curNav; })[0];
     ok('nav: the current page looks different from the others at this width',
        !!otherNav && (w.getComputedStyle(curNav).color !== w.getComputedStyle(otherNav).color ||
                       w.getComputedStyle(curNav, '::after').content !== 'none'));
   }
   /* THIS ASSERTION USED TO REQUIRE href="#top" AND an element carrying
      id="top", which is the precise configuration that did not work. The id
      was on the header, the header is position:fixed, and scrolling a fixed
      element into view is already satisfied, so the link never moved the
      page. Both halves were present and green the whole time.
      A link and a target are not the point. Landing at the top is. */
   var back = d.querySelector('.ftr-top-link a');
   var backHref = (back && back.getAttribute('href')) || '';
   var backTarget = (backHref.charAt(0) === '#' && backHref.length > 1)
     ? d.getElementById(backHref.slice(1)) : null;
   var backOffset = backTarget
     ? Math.round(backTarget.getBoundingClientRect().top + w.scrollY) : -1;
   ok('footer: the way back points at something',  !!back && !!backTarget);
   ok('footer: and that something can actually be scrolled to',
      !!backTarget && w.getComputedStyle(backTarget).position !== 'fixed'
      && backOffset >= 0 && backOffset < 8);
   ok('gauge: takes no pointer events, so it cannot pretend to be a control',
      !d.querySelector('.gauge') ||
      w.getComputedStyle(d.querySelector('.gauge')).pointerEvents === 'none');
   /* `[data-video]` is excluded, and that is not the test being softened to
      fit the code. Its href is a no-JS fallback: with JS the click is
      intercepted and the player is built in place, so the reader never goes
      anywhere and initVideo strips the target and the announcement for
      exactly that reason. It is also the one anchor whose innerHTML gets
      wiped to make room for the iframe, which is how this assertion caught
      it in the first place. */
   var offsite = [].filter.call(d.querySelectorAll('a[href^="http"]'), function (a) {
     return a.hostname && a.hostname !== w.location.hostname &&
            !a.hasAttribute('data-video');
   });
   ok('links: every off-site link says so (' + offsite.length + ' of them)',
      offsite.every(function (a) {
        return /new tab/.test(a.getAttribute('aria-label') || '') ||
               /new tab|scheduling page/.test(a.textContent || '');
      }));

   /* ---- the licensed face, and the tag ----
      Both landed 28 August 2026 and both are the kind of thing that goes
      quiet rather than loud when it breaks. `--carved` named a family that
      nothing served for eight sessions and every headline rendered in the
      fallback while the stack looked correctly wired, so "the token names
      it" is not the assertion. "The face is loaded and the h1 resolves to
      it" is. Adobe's kit is a third party stylesheet: a lapsed Creative
      Cloud seat or a deleted Web Project takes it out with no error on
      this end, and the site quietly reverts to Instrument Serif. */
   /* THE ADOBE KIT IS GONE AND MUST STAY GONE while nothing uses it. It was
      render blocking, it pulled a second blocking stylesheet from
      p.typekit.net, and it cost a first-time visitor 243-323ms to deliver a
      font no rule on the site asks for. Asserting its absence is the only
      way that stays true: a link added back "for the licence" would be
      invisible in every other check here. */
   ok('type: no third-party font stylesheet on the critical path',
      d.querySelectorAll('link[href*="typekit"], link[rel=preconnect][href*="typekit"]').length===0);
   ok('type: and no kit face is loaded',
      ![].some.call(d.fonts || [], function (f) { return /ivyjournal|ivypresto/i.test(f.family); }));
   /* THE SITE DOES NOT USE THE KIT, AND THAT IS THE ASSERTION.
      The kit is linked for the Adobe licence. Pointing `--carved` at it
      changed the look of every heading on the site -- ivyjournal is +10%
      cap height and +18.3% x-height against Instrument Serif at the same
      nominal size, and the home hero went from two lines to four -- which
      was never what supplying the licence key was asking for.

      So this asserts the reverse of what it briefly asserted: the carved
      face is Instrument Serif, it is named FIRST because nothing should sit
      in that list that is not served, and no Typekit family is in front of
      it. If the licensed face is ever genuinely wanted, these three change
      together with the carved scale, deliberately, in one commit. */
   var carvedStack = w.getComputedStyle(d.documentElement).getPropertyValue('--carved');
   ok('type: --carved names Instrument Serif first, and no kit family',
      /^\s*"?Instrument Serif"?\s*,/.test(carvedStack) &&
      !/ivyjournal|ivypresto/i.test(carvedStack));
   var carvedH1 = d.querySelector('h1');
   ok('type: the h1 actually resolves to Instrument Serif',
      !!carvedH1 && /Instrument Serif/.test(w.getComputedStyle(carvedH1).fontFamily.split(',')[0]));
   /* It draws the first screen again, so it is preloaded again. */
   ok('type: Instrument Serif is preloaded, because it draws the headline',
      d.querySelectorAll('link[rel=preload][href*="instrument-serif"]').length===1);
   /* ---- consent, and the order it has to happen in ----
      `gtag.js` used to sit in every head and run on load. It does not now:
      consent.js injects it, and only after a reader accepts. These assertions
      run BEFORE the accept test further down, deliberately, because the
      valuable claim is the negative one -- that a reader who has not answered
      has sent nothing to Google. Each page gets its own Chrome profile in
      runsuite.sh, so localStorage is empty and the banner is always shown. */
   ok('consent: consent.js is on the page', !!d.querySelector('script[src*="js/consent.js"]'));
   ok('consent: the banner is shown when no choice has been made',
      !!d.querySelector('.cc [data-cc="yes"]') && !!d.querySelector('.cc [data-cc="no"]'));
   ok('consent: nothing has been loaded from Google before a choice',
      d.querySelectorAll('script[src*="googletagmanager"]').length===0 &&
      typeof w.gtag === 'undefined' && typeof w.dataLayer === 'undefined');
   /* Decline has to be as easy to reach and as legible as accept. A decline
      hidden in a link or greyed to a whisper is not consent. */
   (function () {
      var yes = d.querySelector('.cc [data-cc="yes"]'), no = d.querySelector('.cc [data-cc="no"]');
      if (!yes || !no) return;
      var ry = yes.getBoundingClientRect(), rn = no.getBoundingClientRect();
      ok('consent: decline is a real button, same size class as accept',
         rn.height >= 44 && ry.height >= 44 && Math.abs(ry.height - rn.height) < 4 &&
         rn.width > ry.width * 0.6);
      ok('consent: the banner does not push the page around (fixed, CLS safe)',
         w.getComputedStyle(d.querySelector('.cc')).position === 'fixed');
   })();

   /* ---- and accepting actually turns it on ----
      Last, because it injects a real script tag and defines gtag, which
      would make every "nothing before consent" assertion above pass for the
      wrong reason if it ran first. */
   (function () {
      var yes = d.querySelector('.cc [data-cc="yes"]');
      if (!yes) return;
      yes.click();
      ok('consent: accepting injects the tag and defines gtag',
         typeof w.gtag === 'function' &&
         d.querySelectorAll('script[src*="googletagmanager.com/gtag/js"]').length===1);
      ok('consent: and the banner is dismissed once answered', !d.querySelector('.cc'));
   })();


   /* ---- the policy has to describe the site it is on ----
      This page is the only one that makes claims about the other eight, and
      on 28 August it was making two that were false: it named Google
      Analytics twice while no analytics ran, and it listed five third party
      tools while the type came from a sixth. Both are true now, and both are
      the kind of thing that goes false again quietly -- by removing a tag,
      or by bringing the fonts back in house, and forgetting the paragraph.

      The cookie assertion is the sharp one. `_ga_KDB3GWPNHC` carries the
      measurement id, so the policy and the page head are two copies of one
      string. Repoint GA at a different property and the policy names a
      cookie that does not exist on the site, which is a worse failure than
      naming none: it is a specific, checkable, wrong claim in a legal
      document. This reads the id out of the gtag src and looks for it in
      the prose rather than hardcoding it twice more. */
   var policyBody = d.querySelector('.pv-body');
   if (policyBody) {
     var txt = policyBody.textContent;
     /* The id is read from analytics.js's own export rather than from a
        script tag, because there is no gtag tag in the head any more -- it
        is injected on accept. The cross-check is the same one either way:
        the policy and the code must name the same property. */
     var mid = (w.__analytics && w.__analytics.id) || '';
     ok('policy: names the measurement id the site actually uses ('+mid+')',
        !!mid && txt.indexOf('_ga_' + mid.replace('G-','')) > -1);
     ok('policy: and names the plain _ga cookie beside it',
        /\b_ga\b/.test(txt));
     ok('policy: lists Adobe Fonts, which serves the carved face',
        txt.indexOf('Adobe Fonts') > -1);
     ok('policy: and says what Adobe receives, not just that it exists',
        /IP address/i.test(txt));
     ok('policy: still lists the other five tools',
        ['Vercel','HoneyBook','Flodesk','Google Analytics','Google Workspace']
          .every(function (t) { return txt.indexOf(t) > -1; }));
   }

     // ---- no horizontal overflow ----
     ok('layout: no horizontal overflow', d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);
     var shown=[].filter.call(d.images,function(i){
       var r=i.getBoundingClientRect();
       return r.width>0 && r.right>0 && r.left < (d.documentElement.clientWidth+200);
     });
     var broken=shown.filter(function(i){return !i.complete||i.naturalWidth===0;});
     ok('images: '+shown.length+' of '+d.images.length+' in reach, all decoded ('+
        (d.images.length-shown.length)+' lazy tiles parked off the rail)', broken.length===0);
     done();
    }catch(e){ lines.push('FAIL  threw in rest(): '+e.message+' @ '+(e.stack||'').split('\n')[1]); done(); }
   }
  }catch(e){ lines.push('FAIL  threw: '+e.message+' @ '+(e.stack||'').split('\n')[1]); done(); }
 }, 6000);
});
</script>
